name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "main"

# Needed so a tag build can attach the package to the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Build Subway GUI
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Subway --icon assets/subway.ico --add-data "assets/subway.ico;assets" --collect-all tkinterdnd2 subway.py

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Download native NeMo-Speech runtimes
        shell: powershell
        run: |
          # Three builds of the same runtime: CUDA for NVIDIA cards, Vulkan for
          # AMD/Intel cards and a CPU fallback. Subway picks one at run time.
          $version = "0.1.0"
          $variants = @{ "cuda" = "nemo-speech"; "vulkan" = "nemo-speech-vulkan"; "cpu" = "nemo-speech-cpu" }
          New-Item -ItemType Directory -Force -Path package\runtime | Out-Null
          foreach ($variant in $variants.Keys) {
            $target = "package\runtime\$($variants[$variant])"
            $zip = "nemo-$variant.zip"
            $extract = "nemo-extract-$variant"
            Invoke-WebRequest -Uri "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v$version/nemo-speech-$version-windows-x86_64-$variant.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $extract -Force
            $exe = Get-ChildItem $extract -Recurse -Filter nemo-speech.exe | Select-Object -First 1
            if (-not $exe) { throw "nemo-speech.exe not found in the $variant archive" }
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item "$($exe.Directory.Parent.FullName)\*" $target -Recurse -Force
            if (-not (Test-Path "$target\bin\nemo-speech.exe")) { throw "Unexpected NeMo-Speech $variant archive layout" }
            Remove-Item $extract -Recurse -Force
            Remove-Item $zip -Force
          }

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          # Needed to compile whisper.cpp's Vulkan shaders. Users only need a GPU driver.
          $version = "1.4.309.0"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          & "$env:RUNNER_TEMP\vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) { throw "Vulkan SDK was not installed" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$version"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$version\Bin"

      - name: Build whisper.cpp runtimes
        shell: powershell
        run: |
          # whisper.cpp publishes no Windows command-line builds, so build two: Vulkan for
          # any graphics card (NVIDIA, AMD, Intel) and a CPU fallback. Static, with the
          # C runtime linked in and no OpenMP, so whisper-cli.exe needs no DLLs beside it.
          $version = "1.9.5"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v$version.zip" -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath . -Force
          $src = "whisper.cpp-$version"
          $variants = @{ "vulkan" = "ON"; "cpu" = "OFF" }
          foreach ($variant in $variants.Keys) {
            $build = "whisper-build-$variant"
            cmake -S $src -B $build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF `
              "-DGGML_VULKAN=$($variants[$variant])"
            if ($LASTEXITCODE) { throw "whisper.cpp $variant configure failed" }
            cmake --build $build --config Release -j 4 --target whisper-cli
            if ($LASTEXITCODE) { throw "whisper.cpp $variant build failed" }
            $exe = Get-ChildItem $build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
            if (-not $exe) { throw "whisper-cli.exe was not built for $variant" }
            $target = "package\runtime\whisper-$variant\bin"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item $exe.FullName $target
            Remove-Item $build -Recurse -Force
          }
          $help = cmd /c "package\runtime\whisper-cpu\bin\whisper-cli.exe --help 2>&1" | Out-String
          if ($help -notmatch "--vad") { throw "whisper-cli has no VAD support" }
          Remove-Item $src -Recurse -Force
          Remove-Item whisper.zip -Force

      - name: Assemble distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\runtime\models | Out-Null
          Copy-Item dist\Subway.exe package\Subway.exe

          # Chocolatey exposes ffmpeg through a shim in its bin directory.
          # Copy the real executable from the installed package, not the shim.
          $ffmpegCandidates = @(
            (Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter ffmpeg.exe -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\tools\\ffmpeg\\bin\\ffmpeg\.exe$" } |
              Select-Object -First 1),
            (Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter ffmpeg.exe -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\bin\\ffmpeg\.exe$" -and $_.Length -gt 1000000 } |
              Select-Object -First 1)
          )
          $ffmpeg = $ffmpegCandidates | Where-Object { $_ } | Select-Object -First 1
          if (-not $ffmpeg) { throw "Real FFmpeg executable not found in Chocolatey installation" }
          Write-Host "Packaging FFmpeg from $($ffmpeg.FullName)"
          Copy-Item $ffmpeg.FullName package\runtime\ffmpeg.exe

          if (-not (Test-Path package\runtime\ffmpeg.exe)) {
            throw "FFmpeg was not copied into the package"
          }
          if ((Get-Item package\runtime\ffmpeg.exe).Length -lt 1000000) {
            throw "Packaged ffmpeg.exe looks like a Chocolatey shim, not the real binary"
          }

          Compress-Archive -Path package\* -DestinationPath Subway-Windows.zip -Force

      - name: Check Whisper recognition
        # Informational: a spoken sentence through the packaged whisper.cpp builds.
        continue-on-error: true
        shell: powershell
        run: |
          curl.exe -fsSL -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$PWD\speech.wav")
          $voice.Speak("Subway makes subtitles for every video on your computer.")
          $voice.Dispose()
          python .github/scripts/smoke_whisper.py package\runtime ggml-tiny.en.bin speech.wav subtitles
          if ($LASTEXITCODE) { throw "Whisper check failed" }

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Subway-Windows
          path: Subway-Windows.zip
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Subway-Windows.zip

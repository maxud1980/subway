name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Subway GUI
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Subway subway.py

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Download native NeMo-Speech runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\runtime | Out-Null
          New-Item -ItemType Directory -Force -Path package\nemo-extract | Out-Null
          Invoke-WebRequest -Uri "https://github.com/NVIDIA/NeMo-Speech.cpp/releases/download/v0.1.0/nemo-speech-0.1.0-windows-x86_64-cuda.zip" -OutFile nemo.zip
          Expand-Archive nemo.zip -DestinationPath package\nemo-extract -Force
          $exe = Get-ChildItem package\nemo-extract -Recurse -Filter nemo-speech.exe | Select-Object -First 1
          if (-not $exe) { throw "nemo-speech.exe not found in the NeMo-Speech archive" }
          $sourceRoot = $exe.Directory.Parent
          New-Item -ItemType Directory -Force -Path package\runtime\nemo-speech | Out-Null
          Copy-Item "$($sourceRoot.FullName)\*" package\runtime\nemo-speech -Recurse -Force
          if (-not (Test-Path package\runtime\nemo-speech\bin\nemo-speech.exe)) {
            throw "Unexpected NeMo-Speech archive layout"
          }
          Remove-Item package\nemo-extract -Recurse -Force
          Remove-Item nemo.zip -Force

      - name: Download Parakeet model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package\runtime\models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3/resolve/main/parakeet-tdt-0.6b-v3.q8_0.gguf" -OutFile package\runtime\models\parakeet-tdt-0.6b-v3.q8_0.gguf

      - name: Assemble distribution
        shell: powershell
        run: |
          Copy-Item dist\Subway.exe package\Subway.exe
          $ffmpeg = (Get-Command ffmpeg).Source
          Copy-Item $ffmpeg package\runtime\ffmpeg.exe
          Compress-Archive -Path package\* -DestinationPath Subway-Windows.zip -Force

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Subway-Windows
          path: Subway-Windows.zip
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Subway-Windows.zip
